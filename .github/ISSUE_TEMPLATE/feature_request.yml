name: Feature request
description: Ask for a new capability or a change in behaviour.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out or do?
      description: Describe the question about your sessions that you cannot answer today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Botsworth to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do now instead?
