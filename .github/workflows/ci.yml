name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - run: make check
      # Prove the wheel bundles the UI. One job is enough; the build does not depend on the OS.
      - name: Build wheel and check it bundles the UI
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          make build
          unzip -l dist/*.whl | grep botsworth/http/ui/index.html
