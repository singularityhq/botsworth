[project]
name = "botsworth"
version = "0.1.0"
description = "Where time, tokens and money went in Claude Code, Codex and omp sessions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "madaboutcode" }]
requires-python = ">=3.12"
keywords = ["claude-code", "codex", "omp", "coding-agents", "cost", "profiler", "sessions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "platformdirs>=4.13.0",
]

[project.urls]
Homepage = "https://github.com/singularityhq/botsworth"
Repository = "https://github.com/singularityhq/botsworth"
Issues = "https://github.com/singularityhq/botsworth/issues"
Changelog = "https://github.com/singularityhq/botsworth/blob/main/CHANGELOG.md"

[project.scripts]
botsworth = "botsworth.cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botsworth"]

# The built UI (`make ui`) ships inside the wheel; `botsworth serve` finds it at botsworth/http/ui/.
[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "botsworth/http/ui"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "pyproject.toml"]
artifacts = ["frontend/dist"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["spikes", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

# Pin the public index so a user-level uv default index cannot rewrite uv.lock.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
